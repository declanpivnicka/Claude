name: Obenauf Flip Scout

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours, around the clock
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyze but don't send alerts or save state"
        type: boolean
        default: false

permissions:
  contents: write   # to commit the seen-lots state file

concurrency:
  group: flip-scout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flip-scout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flip-scout/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scan auctions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python scout.py --dump pages ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save crawled pages (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawled-pages
          path: flip-scout/pages
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        if: success() && !inputs.dry_run
        run: |
          git config user.name "flip-scout bot"
          git config user.email "flip-scout@users.noreply.github.com"
          git add state/seen.json reports
          git diff --cached --quiet || git commit -m "flip-scout: scan results"
          git pull --rebase && git push
